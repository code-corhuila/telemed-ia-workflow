spring:
  application:
    name: telemed-ia-workflow
server:
  port: ${PORT:8080}
  error:
    # Errors answer with the shared envelope; nothing internal reaches the client.
    include-message: never
    include-stacktrace: never
    include-exception: false
workflow:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}            # identity's RSA PUBLIC KEY PEM; required at startup
logging:
  structured:
    format:
      console: ecs                          # one JSON object per line
